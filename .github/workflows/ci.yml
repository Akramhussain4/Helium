name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    # Native tests only run on their own host: Linux runs JVM, JS, Wasm and Linux tests,
    # macOS runs the Apple tests and Windows runs the MinGW tests
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v6

      - run: ./gradlew check

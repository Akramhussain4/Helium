name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    # Only the JVM tests run here, to save Actions minutes: JVM bytecode behaves the same on every OS, so one Linux
    # runner is enough. The JS, Wasm and native tests run in the publish workflow's full check before each release,
    # and locally with ./gradlew check.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v6

      - run: ./gradlew jvmTest checkKotlinAbi
